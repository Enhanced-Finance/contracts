[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
ast = true
ffi = true
build_info = true
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
# Sei testnet configuration
fs_permissions = [
    { access = "read", path = "/" },
    { access = "read-write", path = "./.deploy" },
]
libraries = [
    "src/core/libs/Parser.sol:Parser:0x2E7C2292a73cE5e7d4c57687231143283D14cD9F",
    "src/core/libs/MarginVault.sol:MarginVault:0x6fc6e0E92707e36dC969797Bf524Bb4ECdd5a999",
    "src/core/libs/EnhancedOptionsTimelockLib.sol:EnhancedOptionsTimelockLib:0x3D842D10aebAab97426313606Ae5D1c9bEee780a",
    # Local/test placeholders. For live deploys, run the library deploy scripts and replace these
    # addresses; deployment and upgrade commands read linked libraries from foundry.toml.
    "src/periphery/vault/libs/EnhancedVaultRecordsLib.sol:EnhancedVaultRecordsLib:0xac767Ca3E423ffC5Ae58865d6c1380340fDCA48D",
    "src/periphery/vault/libs/EnhancedVaultCycleLib.sol:EnhancedVaultCycleLib:0xd6AbF4444089d5371416f1bDAF5176bc14EFb896",
]

[rpc_endpoints]
sepolia = "${TESTNET_RPC}"
mainnet = "${PROD_RPC}"

[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "asm-keccak256",
    "unsafe-typecast",
    "pascal-case-struct",
    "unsafe-cheatcode",
]
