[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
ast = true
ffi = true
build_info = true
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
# Sei testnet configuration
fs_permissions = [
    { access = "read", path = "/" },
    { access = "read-write", path = "./.deploy" },
]
libraries = [
    "src/core/libs/Parser.sol:Parser:0xD46d7D1c10030Ef6063282374D31E78ab7112C71",
    "src/core/libs/MarginVault.sol:MarginVault:0x48CCcDd73BD72b87eB0FEf42141f329E9512feeB",
]

[rpc_endpoints]
sei_testnet = "${SEI_TESTNET_RPC}"
sei_mainnet = "${SEI_MAINNET_RPC}"

[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "asm-keccak256",
    "unsafe-typecast",
    "pascal-case-struct",
    "unsafe-cheatcode",
]
